      <!-- ===== Mixed Practice ===== -->
      <fieldset data-mod="mix">
        <legend>Topics to mix</legend>
        <div id="mixPartsBox" hidden>
          <ol id="mixPartsList" class="parts"></ol>
          <p class="note" id="mixPartsNote"></p>
          <button type="button" class="btn ghost sm" id="mixPartsClear">Use the topic checkboxes</button>
