      <!-- ===== Number Sense ===== -->
      <fieldset data-mod="ns">
        <legend>Problem types</legend>
        <label class="chk"><input type="checkbox" name="ns_type" value="place"><b>Place value</b><small>Underlined digit, digit in a place, expanded and standard form.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="compare"><b>Compare numbers</b><small>Write <, > or = between two numbers.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="order"><b>Order numbers</b><small>Least to greatest or greatest to least.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="round"><b>Rounding</b><small>Whole numbers and decimals.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="skip"><b>Skip counting and patterns</b><small>Fill in the missing numbers.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="parity"><b>Even and odd</b><small>Circle even or odd, or pick out numbers in a list.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="line"><b>Number lines</b><small>Read the number the arrow shows.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="est"><b>Estimation</b><small>Round each number, then add, subtract or multiply.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="bond"><b>Number bonds</b><small>Decompose to 10, make ten, teen numbers as ten and ones.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="eqn"><b>Unknown in an equation</b><small>Find the missing number in any position.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="equal"><b>Equal sign</b><small>True or false equations and balancing both sides.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="prop"><b>Properties of operations</b><small>Commutative, associative and distributive.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="rel"><b>Related facts</b><small>Subtraction as unknown addend, division as unknown factor.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="more"><b>Mentally add or subtract 10 or 100</b><small>10 more or less, 100 more or less.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="sub10"><b>Subtract tens</b><small>Subtract a multiple of 10 from a two-digit number.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="mul10"><b>Multiply by multiples of 10</b><small>One digit times 10 to 90.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="tens"><b>Tens and ones</b><small>Write a number as tens and ones.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="kseq"><b>Count to 100</b><small>Count by ones and tens, or back from 10.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="cseq"><b>Count to 1000</b><small>Count by 5s, 10s and 100s.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="numrw"><b>Read and write numbers</b><small>Number words, tens and ones, and base-ten blocks, to 120.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="bondp"><b>Number bonds with pictures</b><small>Two-color counters and ten-frames.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="substr"><b>Subtraction strategies</b><small>Think addition, make a ten, count back.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="cmp2"><b>Compare two-digit numbers</b><small>Write <, > or = between numbers 10 to 99.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="par20"><b>Odd and even to 20</b><small>Pair the objects, or write an even number as two equal addends.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="moreexp"><b>10 more or less, explained</b><small>Write the number and say how you know.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="cfwd"><b>Count on or back</b><small>Count from any number, back from 20, or by 1, 2, 5 to 120.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="mcomp"><b>Multiplicative comparison</b><small>"__ times as many as" statements.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="f100"><b>Tenths and hundredths</b><small>Rename tenths as hundredths and add.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="fact"><b>Factors and multiples</b><small>Factor pairs, multiples, prime or composite.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="perim"><b>Perimeter</b><small>From side lengths, an unknown side, or same perimeter and same area.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="wadd"><b>Add and subtract word problems</b><small>Add to, take from, put together, compare; unknown in any position.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="wlen"><b>Length word problems</b><small>Add and subtract lengths within 100.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="wmul"><b>Multiply and divide word problems</b><small>Equal groups, arrays, comparison, multi-step.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="wcmp"><b>Comparison word problems</b><small>"Times as many" stories.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="wstep"><b>Multi-step word problems</b><small>Remainders and more than one operation.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="west"><b>Estimate and solve</b><small>Two-step stories: round to the nearest ten, then solve.</small></label>
        <label class="chk"><input type="checkbox" name="ns_type" value="rnd3"><b>Round to 10 or 100</b><small>Plain problems and number lines.</small></label>
      </fieldset>

      <fieldset data-mod="ns">
        <legend>Difficulty</legend>
        <div class="seg" role="radiogroup" aria-label="Difficulty">
          <label><input type="radio" name="ns_level" value="1"><span>Easy</span></label>
          <label><input type="radio" name="ns_level" value="2"><span>Medium</span></label>
          <label><input type="radio" name="ns_level" value="3"><span>Hard</span></label>
        </div>
        <p class="note" id="nsNote"></p>
      </fieldset>
