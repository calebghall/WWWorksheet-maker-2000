      <!-- ===== Fractions, Decimals and Percents ===== -->
      <fieldset data-mod="fdp">
        <legend>Problem types</legend>
        <label class="chk"><input type="checkbox" name="fd_type" value="simp"><b>Simplify fractions</b><small>Write a fraction in lowest terms.</small></label>
        <label class="chk"><input type="checkbox" name="fd_type" value="equiv"><b>Equivalent fractions</b><small>Fill in the missing numerator or denominator.</small></label>
        <label class="chk"><input type="checkbox" name="fd_type" value="cmp"><b>Compare fractions</b><small>Write <, > or = between two fractions.</small></label>
        <label class="chk"><input type="checkbox" name="fd_type" value="fadd"><b>Add and subtract fractions</b><small>Like and unlike denominators.</small></label>
        <label class="chk"><input type="checkbox" name="fd_type" value="fmul"><b>Multiply and divide fractions</b><small>Fraction of a number, products and quotients.</small></label>
        <label class="chk"><input type="checkbox" name="fd_type" value="decadd"><b>Add and subtract decimals</b><small>Stacked with the decimal points lined up.</small></label>
        <label class="chk"><input type="checkbox" name="fd_type" value="decmul"><b>Multiply and divide decimals</b><small>Whole-number factors, decimal factors, powers of ten.</small></label>
        <label class="chk"><input type="checkbox" name="fd_type" value="conv"><b>Convert fractions, decimals, percents</b><small>Six conversions between the three forms.</small></label>
        <label class="chk"><input type="checkbox" name="fd_type" value="pct"><b>Percent of a number</b><small>Such as 25% of 80.</small></label>
      </fieldset>

      <fieldset data-mod="fdp">
        <legend>Difficulty</legend>
        <div class="seg" role="radiogroup" aria-label="Difficulty">
          <label><input type="radio" name="fd_level" value="1"><span>Easy</span></label>
          <label><input type="radio" name="fd_level" value="2"><span>Medium</span></label>
          <label><input type="radio" name="fd_level" value="3"><span>Hard</span></label>
        </div>
        <p class="note" id="fdNote"></p>
      </fieldset>
