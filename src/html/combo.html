      <!-- ===== Combined worksheet ===== -->
      <fieldset data-mod="combo">
        <legend>Sections</legend>
        <div id="partsBox" hidden>
          <ol id="partsList" class="parts"></ol>
          <p class="note">This standard sets one or more parts, each with its own settings. The module tabs do not change them.</p>
          <button type="button" class="btn ghost sm" id="partsClear">Use simple sections</button>
        </div>
        <div id="comboRows"></div>
        <p class="note" id="comboNote">Each section uses the settings from its own tab. Press Settings to change them.</p>
      </fieldset>
