name: Problem with a worksheet
description: Report a wrong answer, a layout problem or anything else that looks off
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong
      description: Which problem number, and what it shows. Paste the text of the problem if you can.
    validations:
      required: true
  - type: input
    id: problem
    attributes:
      label: Problem number
      description: The number printed beside the problem, and whether it is on the worksheet or the answer key (for example, "7, answer key").
  - type: textarea
    id: expected
    attributes:
      label: What it should be
  - type: input
    id: set_code
    attributes:
      label: Set code
      description: Filled in by the app. The same code and settings make the same problems.
  - type: input
    id: share_link
    attributes:
      label: Link to this worksheet
      description: Filled in by the app, the same address as the Share link button. Opening it shows this exact worksheet.
  - type: textarea
    id: settings
    attributes:
      label: Worksheet settings
      description: Filled in by the app. Leave as is.
      render: json
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Filled in by the app.
